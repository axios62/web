<!DOCTYPE html>
<html lang="pt-BR" class="dark h-full overflow-hidden">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axios</title>
    <link rel="icon" type="image/svg+xml" href="https://raw.githubusercontent.com/axios62/assets/refs/heads/main/icon/icon.svg" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Roboto', 'sans-serif'],
                    },
                    colors: {
                        yt: {
                            headerBg: '#0E0E0E',
                            bg: '#030303',
                            card: '#2A2A2A',
                            cardHover: '#0A2036',
                            cardHoverAlert: '#BB0000',
                            text: '#FFF',
                            secondary: '#ABABAB',
                            border: '#383838',
                            accent: '#ff0000',
                            pill: '#ffffff1a',
                            pillHover: '#ffffff33',
                            button: '#232323',
                            buttonHover: '#434343'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #aaa;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #717171;
        }

        body {
            background-color: #0f0f0f;
            color: #f1f1f1;
            font-family: 'Roboto', sans-serif;
        }
    </style>
</head>

<body class="h-screen w-screen flex flex-row overflow-hidden bg-yt-bg text-yt-text select-none">

    <!-- BARRA LATERAL ESQUERDA -->
    <aside
        class="w-[150px] bg-yt-headerBg text-white flex flex-col  items-center justify-between py-4 shrink-0 border-r border-yt-border z-50">
        <!-- Logo e Tag -->
        <div class="flex flex-col items-center gap-2">
            <a href="#" class="flex flex-col items-center gap-1 group pt-3">
                <img class="h-20 object-contain transition transform group-hover:scale-105"
                    src="https://raw.githubusercontent.com/axios62/assets/refs/heads/main/icon/icon.svg" alt="Axios">
                <!-- <span class="text-[12px] font-normal px-2 py-0.5 rounded-full bg-yt-cardHoverAlert/100">BETA</span> -->
            </a>
        </div>

        <!-- Links de Perfil / Ações -->
        <div class="flex flex-col items-center gap-4">
            <a href="https://lucasoal.github.io/portfolio" target="_blank">
                <img src="https://avatars.githubusercontent.com/u/69632369"
                    class="w-8 h-8 rounded-full object-cover cursor-pointer hover:ring-2 hover:ring-blue-500 transition">
            </a>
            <a href="https://linkedin.com/in/lucasoal" target="_blank">
                <img src="https://thumb.wikimedia.org/wikipedia/commons/thumb/8/81/LinkedIn_icon.svg/1280px-LinkedIn_icon.svg.png"
                    class="w-8 h-8 rounded-full object-cover cursor-pointer hover:ring-2 hover:ring-blue-500 transition">
            </a>
            <a href="https://github.com/lucasoal" target="_blank">
                <img src="https://thumb.wikimedia.org/wikipedia/commons/thumb/2/24/Github_logo_svg.svg/1280px-Github_logo_svg.svg.png"
                    class="w-8 h-8 rounded-full object-cover cursor-pointer hover:ring-2 hover:ring-blue-500 transition">
            </a>
        </div>
    </aside>

    <!-- ÁREA PRINCIPAL DA PÁGINA (VIEWPORT FIXA COM 2 COLUNAS) -->
    <div class="flex-1 flex justify-center overflow-hidden">
        <main class="flex-1 flex overflow-hidden p-4 lg:p-10 gap-10 max-w-[1600px] w-full">
            <!-- COLUNA ESQUERDA: POWER BI + DETALHES -->
            <div class="flex-1 flex flex-col min-w-0 overflow-y-auto pr-2 custom-scroll">

                <!-- CONTAINER DO IFRAME DO POWER BI -->
                <div
                    class="w-full aspect-video bg-black rounded-xl overflow-hidden shadow-xl relative border border-yt-border/100 group shrink-0">
                    <!-- Dash Base -->
                    <!-- <iframe src="https://app.powerbi.com/view?r=eyJrIjoiZTU4N2E1NDUtNmFiNi00M2EyLTk4MmEtMGQ0MWUyNWZjZDEyIiwidCI6ImQ4ZTNmYTEzLTlkZGItNGNjNS04YTJhLWY1NjQ5OWYxNGUyNSJ9" id="powerbi-frame" class="w-full h-[calc(100%+36px)] border-0 -mb-[36px]" allowFullScreen="true"> </iframe> -->
                    <!-- Dash no Mirror -->
                    <iframe
                        src="https://app.powerbi.com/view?r=eyJrIjoiZTU4N2E1NDUtNmFiNi00M2EyLTk4MmEtMGQ0MWUyNWZjZDEyIiwidCI6ImQ4ZTNmYTEzLTlkZGItNGNjNS04YTJhLWY1NjQ5OWYxNGUyNSJ9"
                        id="powerbi-frame" class="w-full h-[calc(100%+36px)] border-0 -mb-[36px]"
                        allowFullScreen="true"> </iframe>
                </div>
            </div>
            </script>
</body>

</html>
